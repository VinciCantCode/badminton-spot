name: badminton-spot monitor

on:
  workflow_dispatch:
    # Manual control panel: select locations and weekdays
    inputs:
      # Locations selection
      loc_delbrook:
        description: 'Delbrook Community Recreation Centre'
        type: boolean
        required: true
        default: true
      loc_jbcc:
        description: 'John Braithwaite Community Centre (JBCC)'
        type: boolean
        required: true
        default: true
      loc_lions_gate:
        description: 'Lions Gate Community Recreation Centre'
        type: boolean
        required: true
        default: true
      loc_lynn_creek:
        description: 'Lynn Creek Community Recreation Centre'
        type: boolean
        required: true
        default: true
      loc_parkgate:
        description: 'Parkgate Community Centre'
        type: boolean
        required: true
        default: true

      # Weekdays selection
      day_monday:
        description: 'Monday'
        type: boolean
        required: true
        default: true
      day_tuesday:
        description: 'Tuesday'
        type: boolean
        required: true
        default: true
      day_wednesday:
        description: 'Wednesday'
        type: boolean
        required: true
        default: true
      day_thursday:
        description: 'Thursday'
        type: boolean
        required: true
        default: true
      day_friday:
        description: 'Friday'
        type: boolean
        required: true
        default: true
      day_saturday:
        description: 'Saturday'
        type: boolean
        required: true
        default: false
      day_sunday:
        description: 'Sunday'
        type: boolean
        required: true
        default: false

      available:
        description: 'Show available court slots only'
        type: boolean
        required: true
        default: true
      my_schedule:
        description: 'Filter by personal schedule (After 18:00 weekdays, all day weekends)'
        type: boolean
        required: true
        default: true

  repository_dispatch:
    # Triggered externally via cron-job.org
    types: [run-monitor]

jobs:
  monitor:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant write permission to commit changes
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Scraper
        env:
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # 1. Aggregate selected locations
            LOCS=""
            if [ "${{ github.event.inputs.loc_delbrook }}" = "true" ]; then LOCS="$LOCS Delbrook"; fi
            if [ "${{ github.event.inputs.loc_jbcc }}" = "true" ]; then LOCS="$LOCS JBCC"; fi
            if [ "${{ github.event.inputs.loc_lions_gate }}" = "true" ]; then LOCS="$LOCS Lions"; fi
            if [ "${{ github.event.inputs.loc_lynn_creek }}" = "true" ]; then LOCS="$LOCS Lynn"; fi
            if [ "${{ github.event.inputs.loc_parkgate }}" = "true" ]; then LOCS="$LOCS Parkgate"; fi
            
            if [ -n "$LOCS" ]; then
              ARGS="$ARGS --location $LOCS"
            fi
            
            # 2. Aggregate selected weekdays
            DAYS=""
            if [ "${{ github.event.inputs.day_monday }}" = "true" ]; then DAYS="$DAYS Monday"; fi
            if [ "${{ github.event.inputs.day_tuesday }}" = "true" ]; then DAYS="$DAYS Tuesday"; fi
            if [ "${{ github.event.inputs.day_wednesday }}" = "true" ]; then DAYS="$DAYS Wednesday"; fi
            if [ "${{ github.event.inputs.day_thursday }}" = "true" ]; then DAYS="$DAYS Thursday"; fi
            if [ "${{ github.event.inputs.day_friday }}" = "true" ]; then DAYS="$DAYS Friday"; fi
            if [ "${{ github.event.inputs.day_saturday }}" = "true" ]; then DAYS="$DAYS Saturday"; fi
            if [ "${{ github.event.inputs.day_sunday }}" = "true" ]; then DAYS="$DAYS Sunday"; fi
            
            if [ -n "$DAYS" ]; then
              ARGS="$ARGS --days $DAYS"
            fi
            
            # 3. Other toggles
            if [ "${{ github.event.inputs.available }}" = "true" ]; then
              ARGS="$ARGS --available"
            fi
            if [ "${{ github.event.inputs.my_schedule }}" = "true" ]; then
              ARGS="$ARGS --my-schedule"
            fi
          else
            # Cron/API trigger: default to Supabase mode, no CLI filtering arguments needed
            ARGS=""
          fi
          
          python backend/scraper.py $ARGS

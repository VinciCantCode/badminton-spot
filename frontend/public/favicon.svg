<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Solid Dark Navy Background (No Container Frame) -->
  <rect width="100" height="100" rx="20" fill="#0b0f19"/>

  <!-- Short Subtle Motion Arc -->
  <path d="M 22 78 Q 38 68 52 54" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round" opacity="0.45" stroke-dasharray="3 6"/>

  <!-- Short Glowing Arc Sparkle -->
  <circle cx="22" cy="78" r="3" fill="#a3e635" opacity="0.6"/>

  <!-- Prominent Large Shuttlecock Feather Cone (Filling 85% of Frame) -->
  <path d="M 72 26 L 30 46 L 48 78 L 74 38 Z" fill="#a3e635"/>
  <path d="M 74 24 L 32 20 L 30 46 L 72 26 Z" fill="#b9f056"/>

  <!-- Distinct Feather Rib Lines -->
  <line x1="72" y1="26" x2="31" y2="44" stroke="#0b0f19" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="70" y1="29" x2="46" y2="74" stroke="#0b0f19" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="73" y1="24" x2="34" y2="21" stroke="#0b0f19" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Feather Cross Bands -->
  <path d="M 33 22 Q 35 44 46 74" fill="none" stroke="#0b0f19" stroke-width="2.5"/>

  <!-- Large Solid Shuttlecock Cork Head -->
  <circle cx="75" cy="23" r="10" fill="#a3e635"/>
  <circle cx="77" cy="21" r="8" fill="#d9f99d"/>
</svg>